name: Zomma
description: >-
  Zomma (Zomma Labs) is a Y Combinator (Summer 2026) startup building AI agents
  that automate repetitive back-office operations for investment firms — hedge
  funds, asset managers, and fintech companies. Rather than integrating through
  traditional APIs, its computer-use agents perceive and operate existing
  portals, desktop applications, and PDFs the way a human would (clicking,
  reading, typing) to handle reconciliation, client onboarding, KYC, and
  investor reporting, with human approval required before any submission. Zomma
  also markets a developer-facing computer-use API ("plug Hermes, Claude, or
  your own agent into our API") that is currently waitlist / pre-general
  availability with no public specification, SDK, or documentation.
